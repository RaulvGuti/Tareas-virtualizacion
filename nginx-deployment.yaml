apiVersion: apps/v1
kind: Deployment
metadata:
  name: raul-nginx
  namespace: hw-05
  labels:
    app: raul-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: raul-nginx
  template:
    metadata:
      labels:
        app: raul-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80