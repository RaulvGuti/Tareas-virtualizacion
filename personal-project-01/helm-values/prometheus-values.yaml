alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

server:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  retention: 2d
  persistentVolume:
    enabled: false
  service:
    type: ClusterIP
