apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-whoami
  namespace: parcial-reaga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-whoami
  template:
    metadata:
      labels:
        app: web-whoami
    spec:
      containers:
      - name: web
        image: traefik/whoami
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-whoami
  namespace: parcial-reaga
spec:
  selector:
    app: web-whoami
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-whoami
  namespace: parcial-reaga
spec:
  ingressClassName: traefik
  rules:
  - host: whoami.reaga.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-whoami
            port:
              number: 80
